<!-- loops_and_iteration.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1. while
    // - 조건이 참인 동안 반복
    let i = 0

    while (i < 6) {
      console.log(i) // 0 ~ 5
      i += 1
    }


    // 2. for
    // - for ([초기문]; [조건문]; [증감문]) / 매번 i를 재할당하므로 let 사용 (const 불가)
    for (let i = 0; i < 6; i++) {
      console.log(i) // 0 ~ 5
    }

    // for의 i는 블록 스코프라 반복문 밖에서는 보이지 않음
    // -> 여기서 출력되는 i는 1번 while에서 선언한 바깥 i
    // -> 1번 코드를 지우고 실행하면 ReferenceError: i is not defined
    console.log(i)  // 6


    // 3. for...in
    // - 객체의 "키(key)"를 하나씩 꺼냄
    const fruits = {
      a: 'apple',
      b: 'banana'
    }

    for (const property in fruits) {
      console.log(property) // a, b
      console.log(fruits[property]) // apple, banana (키로 값 조회)
    }


    // 4. for...of
    // - 반복 가능한(iterable) 객체(배열, 문자열 등)의 "값(value)"을 하나씩 꺼냄
    // - 매 반복마다 새 변수가 만들어지므로 const 사용 가능
    const numbers = [0, 1, 2, 3]
    for (const number of numbers) {
      console.log(number) // 0, 1, 2, 3
    }

    const myStr = 'apple'

    for (const str of myStr) {
      console.log(str) // a, p, p, l, e
    }


    // 5. for...in 과 for...of 의 차이
    const arr = ['a', 'b', 'c']

    for (const i in arr) {
      console.log(i) // 0, 1, 2 (인덱스, 그것도 '문자열')
    }

    for (const i of arr) {
      console.log(i) // a, b, c (값)
    }

    // => 배열은 for...of, 객체는 for...in
  </script>
</body>

</html>
