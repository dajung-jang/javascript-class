<!-- this-keyword.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // Method & this 예시
    const person = {
      name: 'Alice',
      greeting: function () {
        return `Hello my name is ${this.name}`  // this 는 person 을 가리킴
      },
    }

    console.log(person.greeting()) 


    // 1.1 단순 호출
    // window객체와 document객체의 차이
    // window 는 최상위 객체 window.document
    // document 는 웹페이지의 HTML 전체

    const myFunc = function () {
      return this // this 는 window
    }

    console.log(myFunc())
    console.log(myFunc().document)


    // 1.2 메서드 호출
    // 객체안에 함수
    const myObj = {
      data : 1,
      myFunc() {
        return this // this 는 myObj
      }
    }

    console.log(myObj.myFunc())


    // 2. 중첩된 함수
    // 2.1 일반 함수

    // forEach : 함수 -> 함수의 인자로 function(number) 함수가 들어감
    // 이건 콜백함수다
    // 근데 콜백함수를 화살표 함수로 안쓰니까 문제 발생

    const myObj2 = {
      numbers : [1, 2, 3],
      myFunc() {
        // forEach : 반복문
        this.numbers.forEach(function(number) {
          console.log(this) // => 중첩함수의 this가  window를 가리킴 => 문제가 있다 
          // 문제 해결 : 화살표 함수
        })
      }
    }

    // 메서드호출
    myObj2.myFunc()


    // 2.2 화살표 함수
    const myObj3 = {
      numbers : [1, 2, 3],
      myFunc() {
        this.numbers.forEach((number) => {
          console.log(this) // this 는 myObj3
        })
      }
    }

    // 메서드호출
    myObj3.myFunc()

    // 결론 : 콜백함수에서는 반드시 화살표 함수를 사용해야 한다.
    
    // 콜백함수 : 함수의 인자로 함수가 들어간 것


  </script>
</body>

</html>
