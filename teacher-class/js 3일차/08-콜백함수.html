<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    
    // 콜백함수란?
    // 함수의 인자로 들어가는 함수
   
    // 1
    // forEach
    const numbers1 = [1, 2, 3]

    numbers1.forEach(function(num) {
      console.log(num**2)
    })

    // 1번 방식을 화살표 함수로
    // 1. function 키워드 삭제 2. 인자가 1개면 소괄호 삭제
    numbers1.forEach(num => console.log(num**2))
    // 단점 : 콜백함수를 재사용 불가능 (변수에 할당하지 않았으니까)


    // 2 함수 표현식
    const numbers2 = [4, 5, 6]
    const callBackFunction1 = function (num) {
      console.log(num**2)
    }
    // 함수 호출
    // forEach 함수의 인자로 callbackFunction1함수가 들어갔다
    // callbackFunction1 이 콜백함수
    numbers2.forEach(callBackFunction1) 
    
    // 2번 방식을 화살표 함수로
    const callBackFunction2 = num => console.log(num**2)
    numbers2.forEach(callBackFunction2)

    // 2번 방식은 언제 쓸까?
    // 장점 : 콜백함수를 변수에 할당해서 함수 표현식으로 쓰면 콜백함수의 재사용이 가능
    // 결론 : 함수표현식 + 화살표함수 같이 사용


  </script>
</body>

</html>
