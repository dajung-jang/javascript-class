<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <script>

    //1. 원시자료형과 참조자료형의 차이

    // 원시 자료형 : Number, String, Boolean, null, undefined
    //  => 불변 자료형
    // 참조 자료형 : Object (객체, 배열, 함수)
    //  => 가변 자료형

    //2. null, undefined, NaN 차이

    // null (python의 none 과 같음) - 값을 의도적으로 비운다
    const user = null
    console.log(user)

    // undefined - 값이 할당되지 않은 상태
    let name
    console.log(name)

    // NaN (Not a Number) - 숫자가 아닌 계산 결과
    console.log('hello' * 2)
    console.log(0 / 0)

    //3. 동등연산자와 일치연산자의 차이

    // == (동등연산자) : 암시적 형변환 이루어짐
    // === (일치연산자) : 1. 값 2. 타입 모두 같아야 함
    console.log(0 == false)
    console.log(0 === false)

    //4. 논리연산자

    // and ---> &&
    // or --->  ||
    // not ---> !
    console.log(1 && 3) // 단축평가 (모두 참이어야 참 / 3까지 봐야한다)
    console.log(1 || 3) // 단축평가 (하나만 참이라도 참 / 1만 봐도 참이다)
    console.log(!1)     // true 의 부정 -> false



  
  </script>

</body>
</html>
