<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // for...in
    // 1. 배열, 0 1 2 출력 (속성 출력) -> for in
    const arr = ['a', 'b', 'c']

    for (const i in arr) {
      console.log(i)
    }

    // 2. 객체, korea japan china 출력 (속성 출력) -> for in
    const capitals = {
      korea: '서울',
      japan: '도쿄',
      china: '베이징',
    }

    for (const country in capitals) {
      console.log(country)
    }

    // for...of 중요!!
    // 3. 배열, a b c 출력
    for (const elem of arr) {
      console.log(elem)
    } 

    // 4. 객체, 서울 도쿄 베이징 출력
    // for of 로 값을 출력할 수 있을까? => 안됨
    // 객체는 iterable이 아님
    // 해법 : for in 사용
    for (const property in capitals) {
      console.log(capitals[property])
    }

    const obj = {
      2 : 'b',
      1 : 'a',
      c : '3',
      b : '2',
      a : '1',
    }

    for (const key in obj) {
      console.log(key)
      // Number 와 String이 다르다!
      // Number : 작은 숫자부터 출력
      // String : 삽입 순서대로 출력
      // => 출력 결과 : 1 2 c b a
    }

  </script>
</body>

</html>
